<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>論語 입체 사유 공간 | 獨樂堂 디지털 아카이브</title>
  <meta name="description" content="독락당 디지털 아카이브: 仁·禮·君子를 중심으로 시대별 논어 해석을 탐색하는 입체 사유 공간." />
  <link rel="icon" href="data:," />
  <style>
    :root {
      --bg-dark: #141413;
      --panel-bg: rgba(28, 27, 25, 0.90);
      --text-main: #f0ede6;
      --text-muted: #a8a296;
      --accent-gold: #c89d54;
      --border-line: rgba(200, 157, 84, 0.3);
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body, html { width: 100%; height: 100%; overflow: hidden; background: var(--bg-dark); font-family: 'Noto Serif KR', 'Batang', serif; color: var(--text-main); }
    #canvas-container { width: 100%; height: 100%; position: absolute; top: 0; left: 0; z-index: 1; }
    header {
      position: absolute; top: 24px; left: 32px; z-index: 10;
      display: flex; align-items: center; gap: 32px; flex-wrap: wrap;
    }
    .brand-title { font-size: 1.25rem; font-weight: 700; letter-spacing: 0.08em; color: var(--accent-gold); }
    .concept-tabs { display: flex; gap: 10px; }
    .concept-btn {
      background: rgba(20, 20, 19, 0.75); border: 1px solid var(--border-line);
      color: var(--text-main); padding: 8px 18px; font-size: 0.95rem; cursor: pointer;
      transition: all 0.25s ease; border-radius: 4px; font-family: inherit;
    }
    .concept-btn.active, .concept-btn:hover {
      background: var(--accent-gold); color: #141413; font-weight: 700;
    }
    #guide-hint {
      position: absolute; bottom: 28px; left: 32px; z-index: 10;
      background: rgba(20, 20, 19, 0.78); border: 1px solid var(--border-line);
      padding: 12px 20px; border-radius: 4px; font-size: 0.9rem; color: var(--text-muted);
    }
    #overlay-panel {
      position: absolute; top: 0; right: 0; width: 440px; max-width: 90vw; height: 100%; z-index: 10;
      background: var(--panel-bg); backdrop-filter: blur(12px);
      border-left: 1px solid var(--border-line); padding: 40px 32px;
      transform: translateX(100%); transition: transform 0.4s cubic-bezier(0.22, 1, 0.36, 1);
      overflow-y: auto; display: flex; flex-direction: column; gap: 24px;
    }
    #overlay-panel.open { transform: translateX(0); }
    .close-btn {
      align-self: flex-end; background: none; border: none; color: var(--text-muted);
      font-size: 1.5rem; cursor: pointer; line-height: 1;
    }
    .era-badge {
      display: inline-block; padding: 4px 10px; font-size: 0.8rem;
      border: 1px solid var(--accent-gold); color: var(--accent-gold); border-radius: 2px;
    }
    .panel-title { font-size: 1.5rem; margin-top: 8px; border-bottom: 1px solid var(--border-line); padding-bottom: 12px; }
    .quote-box {
      background: rgba(255, 255, 255, 0.04); padding: 16px; border-left: 3px solid var(--accent-gold);
      font-size: 0.95rem; line-height: 1.6;
    }
    .quote-original { font-size: 1.1rem; color: var(--accent-gold); margin-bottom: 6px; }
    .section-label { font-size: 0.85rem; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.05em; }
    .interpretation-text { font-size: 1.02rem; line-height: 1.75; color: var(--text-main); }
    .annotation-box {
      font-size: 0.9rem; color: var(--text-muted); background: rgba(0, 0, 0, 0.3);
      padding: 14px; border-radius: 4px; line-height: 1.6;
    }
    button:focus-visible { outline: 2px solid #f0ede6; outline-offset: 4px; }
    button:disabled { opacity: 0.45; cursor: wait; }
    #canvas-container canvas { display: block; touch-action: none; }
    #overlay-panel { z-index: 20; }
    #guide-hint { max-width: calc(100vw - 64px); line-height: 1.7; pointer-events: none; }
    #era-nav { position: absolute; left: 32px; bottom: 112px; z-index: 10; display: flex; flex-wrap: wrap; gap: 8px; max-width: calc(100vw - 64px); }
    .era-btn { background: rgba(20,20,19,.9); color: var(--text-main); border: 1px solid var(--border-line); border-radius: 4px; padding: 10px 14px; font: inherit; cursor: pointer; }
    .era-btn:hover, .era-btn[aria-pressed="true"] { border-color: var(--accent-gold); color: var(--accent-gold); }
    #load-status { position: absolute; top: 110px; left: 32px; z-index: 10; max-width: calc(100vw - 64px); color: var(--text-muted); background: var(--bg-dark); padding: 10px; }
    #load-status:empty { display: none; }
    #ui-era-summary { font-size: .9rem; line-height: 1.7; color: var(--text-muted); margin-top: 12px; }
    @media (max-width: 600px) {
      header { top: 18px; left: 16px; right: 16px; gap: 14px; }
      .brand-title { font-size: 1rem; }
      .concept-tabs { gap: 6px; }
      .concept-btn { padding: 9px 14px; }
      #era-nav { left: 16px; bottom: 116px; max-width: calc(100vw - 32px); }
      .era-btn { font-size: .8rem; padding: 9px 10px; }
      #guide-hint { left: 16px; bottom: 16px; max-width: calc(100vw - 32px); padding: 10px 12px; font-size: .78rem; }
      #overlay-panel { width: 440px; max-width: 100vw; padding: 24px 20px; }
      .panel-title { font-size: 1.25rem; }
      #load-status { left: 16px; top: 122px; }
    }
    @media (prefers-reduced-motion: reduce) { *, *::before, *::after { transition: none !important; } }
  </style>
</head>
<body>
  <div id="canvas-container"></div>
  <header>
    <div class="brand-title">獨樂堂 · 論語 입체 사유 공간</div>
    <div class="concept-tabs" id="concept-tabs">
      <button class="concept-btn active" data-concept="ren" aria-pressed="true" disabled>仁 (인)</button>
      <button class="concept-btn" data-concept="li" aria-pressed="false" disabled>禮 (예)</button>
      <button class="concept-btn" data-concept="junzi" aria-pressed="false" disabled>君子 (군자)</button>
    </div>
  </header>
  <p id="load-status" role="status">사유 공간을 불러오는 중입니다…</p>
  <nav id="era-nav" aria-label="시대별 주석 탐색"></nav>
  <div id="guide-hint">비석 또는 시대 버튼을 선택하면 상세 주석이 열립니다.<br />드래그: 회전 · 스크롤/두 손가락: 확대·축소 · Esc: 주석 닫기</div>
  <aside id="overlay-panel" aria-labelledby="ui-era-name" aria-hidden="true" inert>
    <button class="close-btn" id="close-panel-btn" aria-label="주석 닫기">&times;</button>
    <div>
      <span class="era-badge" id="ui-era-period">시대 정보</span>
      <h2 class="panel-title" id="ui-era-name">시대 명칭</h2>
      <p id="ui-era-summary"></p>
    </div>
    <div class="quote-box">
      <div class="quote-original" id="ui-core-original"></div>
      <div id="ui-core-translation"></div>
    </div>
    <div>
      <div class="section-label" id="ui-scholar-note">주석 출전</div>
      <h3 style="margin: 6px 0 12px; color: var(--accent-gold);" id="ui-interp-keyword">핵심 키워드</h3>
      <p class="interpretation-text" id="ui-interp-desc"></p>
    </div>
    <div>
      <div class="section-label">원전 주석 (Original Annotation)</div>
      <div class="annotation-box" id="ui-interp-annotation"></div>
    </div>
  </aside>
  <noscript><p style="position:relative;z-index:30;padding:32px">이 3D 공간을 이용하려면 브라우저에서 JavaScript를 켜 주세요.</p></noscript>
  <script type="module" src="/src/main.ts"></script>
</body>
</html>
